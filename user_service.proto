syntax = "proto3";
option csharp_namespace = "ApiEnergyBench.Grpc.AspNetCore.Proto";
service UserService {
  rpc GetUserWithPostsAndComments(UserRequest) returns (UserReply);
}
message UserRequest {
  int32 user_id = 1;
  int32 posts_limit = 2;
  int32 comments_limit = 3;
}
message UserReply {
  int32 id = 1;
  string username = 2;
  string email = 3;
  string created_at = 4;
  repeated PostReply posts = 5;
}
message PostReply {
  int32 id = 1;
  int32 user_id = 2;
  string title = 3;
  string body = 4;
  string created_at = 5;
  repeated CommentReply comments = 6;
}
message CommentReply {
  int32 id = 1;
  int32 post_id = 2;
  string author = 3;
  string body = 4;
  string created_at = 5;
}